[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticgen"
version = "0.1.0"
description = "Evidence-aware molecular graph optimization with replaceable agent and chemistry adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rdkit>=2024.9", "pydantic>=2.8,<3", "httpx>=0.27", "jsonschema>=4.21", "numpy>=1.26"]

[project.optional-dependencies]
syncraft = ["litellm>=1.40", "loguru>=0.7", "tqdm>=4.66"]
evomolsteer = ["pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
agenticgen = "agenticgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenticgen = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises the configured external SynCraft / EvoMolSteer checkouts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
